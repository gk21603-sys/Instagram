{"name": "Build gensui cards", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"run": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "fonts", "run": "sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation"}, {"name": "deps", "run": "pip install --quiet pillow"}, {"name": "build", "run": "python scripts/build_gensui_cards.py"}, {"name": "commit", "run": "git config user.name github-actions && git config user.email actions@users.noreply.github.com && git add images/2026-09-gensui && (git diff --staged --quiet && echo nochange || (git commit -m 'chore: gensui carousel cards' && git push))"}]}}}
