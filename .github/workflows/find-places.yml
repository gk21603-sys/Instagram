{"name":"Find place IDs","on":{"workflow_dispatch":{}},"jobs":{"run":{"runs-on":"ubuntu-latest","steps":[{"name":"search","env":{"T":"${{ secrets.META_ACCESS_TOKEN }}"},"run":"for q in 大間町 大間崎 大間 Oma; do echo \"===== $q\"; curl -sg -G --data-urlencode \"q=$q\" -d type=place -d \"fields=id,name,location\" -d limit=10 -d \"access_token=$T\" \"https://graph.facebook.com/v21.0/pages/search\" -o /tmp/r.json; head -c 2500 /tmp/r.json; echo; echo; done"}]}}}
