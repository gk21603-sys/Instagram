{"name":"Retry errored posts","on":{"workflow_dispatch":{}},"jobs":{"run":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"patch","run":"python3 - <<'EOF'\nimport json\np=json.load(open('posts-scheduled.json',encoding='utf-8'))\nn=0\nfor x in p:\n    if x.get('status')=='error' and x['publish_at'].startswith('2026-09-22'):\n        x['status']='approved'\n        x['publish_at']='2026-09-23T12:00:00+09:00'\n        x.pop('error_message',None)\n        n+=1\njson.dump(p,open('posts-scheduled.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)\nprint('patched',n)\nEOF\n"},{"name":"publish","env":{"META_ACCESS_TOKEN":"${{ secrets.META_ACCESS_TOKEN }}","IG_USER_ID_HIBANOMORI":"${{ secrets.IG_USER_ID_HIBANOMORI }}","IG_USER_ID_HIBASOKEN":"${{ secrets.IG_USER_ID_HIBASOKEN }}"},"run":"node scripts/publish.mjs"},{"name":"commit","run":"git config user.name github-actions\ngit config user.email actions@github.com\ngit add -A\ngit commit -m 'chore: retry errored posts [skip ci]' || exit 0\ngit push\n"}]}}}
