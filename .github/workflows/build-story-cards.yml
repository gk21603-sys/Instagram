name: Build story cards

on:
  workflow_dispatch:
    inputs:
      cards:
        description: 'カード定義JSONのパス（例: stories/hl-hiba-03.json）'
        required: true
        default: 'stories/hl-hiba-03.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 明朝体フォントを導入
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 依存パッケージを導入
        run: pip install --quiet pillow

      - name: カードを生成
        run: python scripts/build_story_cards.py "${{ inputs.cards }}"

      - name: 生成物をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/stories
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: ストーリーカードを生成 [skip ci]"
            git push
          fi
