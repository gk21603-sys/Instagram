name: Collect Instagram insights

on:
  schedule:
    - cron: '40 */6 * * *'   # 6時間ごと（ストーリーの数字は公開後24時間しか取れないため）
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリに書き込むワークフロー同士を直列化する（push競合で投稿済みの記録が落ちるのを防ぐ）
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect insights
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID_HIBANOMORI: ${{ secrets.IG_USER_ID_HIBANOMORI }}
          IG_USER_ID_HIBASOKEN: ${{ secrets.IG_USER_ID_HIBASOKEN }}
        run: node scripts/collect_insights.mjs
      - name: Commit insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insights/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update insights [skip ci]"
          git pull --rebase origin main && git push
