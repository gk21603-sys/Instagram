{"name":"Find place IDs","on":{"workflow_dispatch":{}},"jobs":{"run":{"runs-on":"ubuntu-latest","steps":[{"name":"debug","env":{"T":"${{ secrets.META_ACCESS_TOKEN }}"},"run":"curl -sg -G -d \"input_token=$T\" -d \"access_token=$T\" \"https://graph.facebook.com/v21.0/debug_token\" -o /tmp/d.json; python3 -c \"import json,datetime;d=json.load(open('/tmp/d.json')).get('data',{});e=d.get('expires_at');print('type',d.get('type'));print('valid',d.get('is_valid'));print('expires_at',e,'=>','NEVER' if e==0 else (datetime.datetime.utcfromtimestamp(e).isoformat()+'Z' if e else '?'));print('data_access_expires_at',d.get('data_access_expires_at'));print('scopes',d.get('scopes'))\""}]}}}
