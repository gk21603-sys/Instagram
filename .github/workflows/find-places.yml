{"name":"Find place IDs","on":{"workflow_dispatch":{}},"jobs":{"run":{"runs-on":"ubuntu-latest","steps":[{"name":"search","env":{"T":"${{ secrets.META_ACCESS_TOKEN }}"},"run":"for q in 大間町 大間崎 大間 下北; do echo \"=== $q\"; curl -sg \"https://graph.facebook.com/v21.0/pages/search?q=$q&fields=id,name,location&limit=10&access_token=$T\" | python3 -c \"import sys,json;d=json.load(sys.stdin);[print(p.get('id'),'|',p.get('name'),'|',(p.get('location') or {}).get('latitude'),(p.get('location') or {}).get('longitude'),'|',(p.get('location') or {}).get('city')) for p in d.get('data',[])] if 'data' in d else print('ERR',json.dumps(d.get('error',{}),ensure_ascii=False)[:200])\"; done"}]}}}
