{"name": "Build and seed nomori", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"run": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "fonts", "run": "sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation"}, {"name": "deps", "run": "pip install --quiet pillow numpy"}, {"name": "write script", "run": "python -c \"import base64,pathlib;pathlib.Path('scripts/build_nomori_images.py').write_bytes(base64.b64decode(''))\"}, {"name": "build images", "run": "python scripts/build_nomori_images.py"}, {"name": "write posts", "run": "python -c \"import base64,pathlib;pathlib.Path('/tmp/np.json').write_bytes(base64.b64decode(''))\"}, {"name": "seed posts", "run": "python -c \"import base64,json,pathlib;new=json.loads(pathlib.Path('/tmp/np.json').read_text(encoding='utf-8'));p=json.loads(pathlib.Path('posts-scheduled.json').read_text(encoding='utf-8'));ex={q['images'][0] for q in p if q.get('images')};add=[q for q in new if q['images'][0] not in ex];p.extend(add);pathlib.Path('posts-scheduled.json').write_text(json.dumps(p,ensure_ascii=False,indent=2)+chr(10),encoding='utf-8');print('added',len(add),'total',len(p))\"}, {"name": "commit", "run": "git config user.name github-actions && git config user.email actions@users.noreply.github.com && git add images/2026-08-nomori posts-scheduled.json scripts/build_nomori_images.py && (git diff --staged --quiet && echo nochange || (git commit -m 'chore: nomori images and posts' && git push))"}]}}}
